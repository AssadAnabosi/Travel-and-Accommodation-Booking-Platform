services:
  api:
    image: tabp-api
    build:
      context: .
      dockerfile: API/Dockerfile
    environment:
      # Development enables Swagger UI and the auto-migrate + seed path on startup.
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server,1433;Database=TABP;User Id=sa;Password=Your_strong!Passw0rd;TrustServerCertificate=True;Encrypt=False
    ports:
      - "8080:8080"
    depends_on:
      sql-server:
        condition: service_healthy

  sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: tabp-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sql_data:
